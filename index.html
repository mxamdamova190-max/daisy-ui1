<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="navbar bg-base-100 shadow px-10">

            <div class="navbar-start">
                <a class="text-2xl font-bold text-purple-600">Lumina</a>
            </div>

            <div class="navbar-center">
                <ul class="menu menu-horizontal">
                    <li><a>Home</a></li>
                    <li><a>Shop</a></li>
                    <li><a>About</a></li>
                    <li><a>Contact</a></li>
                </ul>
            </div>

            <div class="navbar-end">
                <button class="btn btn-primary">Login</button>
            </div>

        </div>
    </header>


    <!-- MAIN -->
    <main>

        <!-- HERO -->
        <div class="hero min-h-96 bg-purple-100">

            <div class="hero-content flex-col lg:flex-row-reverse">

                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600"
                     class="max-w-xs rounded-2xl shadow-lg">

                <div>
                    <h1 class="text-5xl font-bold text-purple-900">
                        Discover Your Style!
                    </h1>

                    <p class="py-5">
                        Beautiful clothes, accessories and cosmetics.
                        Find your favorite style with Lumina.
                    </p>

                    <button class="btn btn-primary">
                        Shop Now
                    </button>
                </div>

            </div>
        </div>


        <!-- CARDS -->
        <section class="p-10">

            <h2 class="text-3xl font-bold text-center mb-8">
                Our Categories
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

                <div class="card bg-base-100 shadow">
                    <figure>
                        <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=400">
                    </figure>
                    <div class="card-body">
                        <h2 class="card-title">Clothing</h2>
                        <button class="btn btn-primary">Explore</button>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <figure>
                        <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=400">
                    </figure>
                    <div class="card-body">
                        <h2 class="card-title">Accessories</h2>
                        <button class="btn btn-primary">Explore</button>
                    </div>
                </div>

                <div class="card bg-base-100 shadow">
                    <figure>
                        <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=400">
                    </figure>
                    <div class="card-body">
                        <h2 class="card-title">Cosmetics</h2>
                        <button class="btn btn-primary">Explore</button>
                    </div>
                </div>

            </div>
        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer bg-purple-950 text-white p-10">

        <aside>
            <h2 class="text-2xl font-bold">Lumina</h2>
            <p>Everything for your style!</p>
        </aside>

        <nav>
            <h6 class="footer-title">Links</h6>
            <a>Home</a>
            <a>Shop</a>
            <a>Contact</a>
        </nav>

    </footer>

</body>
</html>

  
</body>
</html>
